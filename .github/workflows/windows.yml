name: Windows checks and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked --features ui,clipboard-events --target-dir target/build
      - run: cargo +stable clippy --locked --all-targets --features ui,clipboard-events --target-dir target/build -- -D warnings
      - name: Synthetic packaging contract
        shell: pwsh
        run: |
          ./tests/release-package-contract.ps1
          python tests/test_third_party_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Notice tests failed' }
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: checks
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and package
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --locked --release --features ui,clipboard-events --bin katran-ui --bin katran-launcher --bin katran --target-dir target/build
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $version = (cargo +stable metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match Cargo version' }
          python scripts/third-party-notices.py --output "$env:RUNNER_TEMP/katran-third-party-notices.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency notice generation failed' }
          ./scripts/package-release.ps1 -OutputDirectory "$env:RUNNER_TEMP/katran-release" -Version $version -BuildInstaller -DependencyNoticesPath "$env:RUNNER_TEMP/katran-third-party-notices.txt"
      - name: Publish immutable release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = "$env:RUNNER_TEMP/katran-release"
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $notes = Join-Path $directory 'release-notes.md'
          [IO.File]::WriteAllText($notes, "Katran $version for Windows x64.`n`nPortable ZIP: extract and run Katran.exe. Installer: per-user installation. Close Katran before running setup. Updates: Settings → Updates. Unsigned binaries; no signing certificate is configured.`n`nSee docs/distribution.md for storage, update and verification contracts.")
          $assets = @(Get-ChildItem -LiteralPath $directory -File | Where-Object { $_.Extension -in @('.zip','.exe','.json') -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Katran $version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }

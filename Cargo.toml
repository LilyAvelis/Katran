[package]
name = "katran"
version = "2.5.0"
edition = "2024"
autobins = false

[[bin]]
name = "katran"
path = "src/main.rs"

[[bin]]
name = "katran-launcher"
path = "src/bin/launcher.rs"
required-features = ["ui"]

[dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache", "fallible_uint", "functions"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
base64 = "=0.22.1"
url = "=2.5.8"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
egui-lucide = {version="=0.1.0",optional=true}
egui_extras = {version="=0.36.2",optional=true,default-features=false,features=["svg"]}
scraper = { version = "=0.29.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
zip = { version = "=9.5.0", default-features = false, features = ["deflate"] }
semver = "=1.0.28"
unicode-general-category = "=1.1.0"
resvg = { version = "=0.45.1", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
windows = {version="=0.62.2",features=["Win32_Foundation","Win32_Security","Win32_System_Com","Win32_System_Ole","Win32_System_SystemServices","Win32_System_Threading","Win32_System_LibraryLoader","Win32_System_DataExchange","Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_UI_Shell_Common","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_Graphics_Direct2D","Win32_Graphics_Direct2D_Common","Win32_Graphics_DirectWrite","Win32_Graphics_Imaging","Win32_Graphics_Dxgi_Common","Win32_System_Com_StructuredStorage","Win32_System_Variant","Win32_UI_Shell_PropertiesSystem","Win32_UI_Input_KeyboardAndMouse"]}
windows-core = "=0.62.2"
arboard = "=3.7.0"
clipboard-win = "=5.4.3"
windows-sys = { version = "=0.61.2", features = ["Win32_System_Memory","Win32_Storage_FileSystem","Win32_System_DataExchange","Win32_Foundation","Win32_System_Threading","Win32_System_LibraryLoader","Win32_System_DataExchange","Win32_UI_WindowsAndMessaging"] }

[dependencies.eframe]
version = "=0.36.2"
optional = true
default-features = false
features = ["glow", "default_fonts"]

[features]
default = ["clipboard-events"]
ui = ["dep:eframe","dep:egui-lucide","dep:egui_extras"]
clipboard-events = []
clipboard-events-test = ["clipboard-events"]

[[bin]]
name = "katran-ui"
path = "src/bin/ui.rs"
required-features = ["ui"]

[dev-dependencies]
tempfile = "=3.27.0"

[build-dependencies]
embed-resource = "=3.0.12"

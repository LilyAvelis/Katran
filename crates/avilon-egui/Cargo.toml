[package]
name = "avilon-egui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-styled egui action rows and shortcut keycaps"
publish = false

[dependencies]
egui = "=0.36.2"
egui-lucide = "=0.1.0"
egui_glow = { version = "=0.36.2", optional = true }
glow = { version = "=0.17.0", optional = true }

[features]
glow = ["dep:egui_glow", "dep:glow"]
